name: Build Native Desktop Apps

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: win

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, dom, fileinfo, curl, zip, sqlite3, pdo_sqlite, bcmath, ctype, xml, openssl, tokenizer
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Linux Packaging Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools

      - name: Install PHP Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --ignore-platform-reqs

      - name: Prepare Laravel Environment
        run: |
          php -r "file_exists('.env') || copy('.env.example', '.env');"
          php -r "file_exists('database/database.sqlite') || (@mkdir('database', 0777, true) && touch('database/database.sqlite'));"
          php artisan key:generate

      - name: Install Node Dependencies & Build Frontend
        run: |
          npm install
          npm run build

      - name: Build NativePHP Desktop Application
        run: php artisan native:build ${{ matrix.target }}
        env:
          NATIVEPHP_BUILDING: true
          APP_ENV: production

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: justLearnCode-${{ matrix.target }}-installer
          path: nativephp/electron/dist/*
          retention-days: 7
