name: Build Native Desktop Apps

on:
  # This triggers the build automatically when you push to the main branch
  push:
    branches: ["main"]
  # Also allows you to trigger the build manually from the GitHub website
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Here we tell GitHub to spin up 3 different cloud machines
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            target: linux
            extension: AppImage
          - os: macos-latest
            target: mac
            extension: dmg
          - os: windows-latest
            target: win
            extension: exe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2" # Update this if you use PHP 8.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install PHP Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node Dependencies & Build React/Vite
        run: |
          npm install
          npm run build

      - name: Build NativePHP Desktop App
        run: php artisan native:build ${{ matrix.target }}
        env:
          # Bypass Windows symlink permission blocks in GitHub Actions
          NATIVEPHP_BUILDING: true

      - name: Upload Compiled Installers
        uses: actions/upload-artifact@v4
        with:
          name: justLearnCode-${{ matrix.target }}-installer
          path: nativephp/electron/dist/*.${{ matrix.extension }}
          retention-days: 7
