name: Build Native Desktop Apps

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            target: linux
            extension: AppImage
          - os: macos-latest
            target: mac
            extension: dmg
          - os: windows-latest
            target: win
            extension: exe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, dom, fileinfo, curl, zip, sqlite3, pdo_sqlite, bcmath
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install PHP Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --ignore-platform-reqs

      - name: Prepare Laravel Environment
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate

      - name: Install Node Dependencies & Build Frontend
        run: |
          npm install
          npm run build

      - name: Build NativePHP Desktop App
        run: php artisan native:build ${{ matrix.target }}
        env:
          NATIVEPHP_BUILDING: true
          APP_ENV: production

      - name: Upload Compiled Installers
        uses: actions/upload-artifact@v4
        with:
          name: justLearnCode-${{ matrix.target }}-installer
          path: nativephp/electron/dist/*
          retention-days: 7
